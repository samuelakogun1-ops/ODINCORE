<section style="margin-top: 2rem;">
  <h3>Transaction History</h3>
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Date &amp; Time</th>
          <th>Reference ID</th>
          <th>Type</th>
          <th>Amount</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="dashboard-tx-table">
        <!-- Dynamically Populated -->
      </tbody>
    </table>
  </div>
</section>

<script src="app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Check global App object availability
    const Engine = window.App || window.app;
    if (!Engine) {
      console.error("ODINCORE Engine failed to initialize.");
      return;
    }

    const user = Engine.getCurrentUser();
    if (!user) {
      window.location.href = 'login.html';
      return;
    }

    const welcomeEl = document.getElementById('welcome-text');
    if (welcomeEl) welcomeEl.innerText = `Welcome, ${user.name}`;

    const refreshDisplay = () => {
      const balance = Engine.calculateBalance(user.accountNumber);
      const balanceEl = document.getElementById('user-balance');
      if (balanceEl) balanceEl.innerText = `$${balance.toFixed(2)}`;

      const txs = Engine.getStorage(Engine.KEYS.TRANSACTIONS);
      const userTxs = txs.filter(t => t.fromAccount === user.accountNumber || t.toAccount === user.accountNumber);
      const tbody = document.getElementById('dashboard-tx-table');
      
      if (!tbody) return;
      tbody.innerHTML = '';

      if (userTxs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding: 1.5rem;">No transaction history found.</td></tr>`;
        return;
      }

      userTxs.reverse().forEach(tx => {
        const isDebit = tx.fromAccount === user.accountNumber;
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${new Date(tx.timestamp).toLocaleString()}</td>
          <td>${tx.id}</td>
          <td>${isDebit ? 'Transfer Out' : 'Credit Received'}</td>
          <td style="color: ${isDebit ? '#ef4444' : '#22c55e'}">${isDebit ? '-' : '+'}$${parseFloat(tx.amount).toFixed(2)}</td>
          <td><strong>${tx.status}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    };

    refreshDisplay();
  });
</script>
