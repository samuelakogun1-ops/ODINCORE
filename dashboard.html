<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ODINCORE User Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <main class="main-content">
      <header style="display:flex; justify-content:space-between; align-items:center;">
        <h2 id="welcome-msg">Welcome</h2>
        <button onclick="ODIN.logout()" style="background:#dc3545; color:#fff; border:none; padding: 0.5rem 1rem; border-radius:4px; cursor:pointer;">Logout</button>
      </header>

      <section style="background: var(--card-bg); padding: 1.5rem; border-radius: 8px; margin-top: 1.5rem;">
        <h4 style="color: var(--text-muted);">Available Balance</h4>
        <h1 id="user-balance" style="font-size: 2.5rem; margin-top: 0.5rem;">$0.00</h1>
      </section>

      <!-- Transfer Form -->
      <section style="background: var(--card-bg); padding: 1.5rem; border-radius: 8px; margin-top: 1.5rem;">
        <h3>Transfer Funds</h3>
        <form id="transfer-form" style="display: grid; gap: 1rem; max-width: 400px; margin-top: 1rem;">
          <input type="text" id="tf-account" placeholder="Recipient Account Number" required style="padding: 0.5rem;">
          <input type="number" step="0.01" id="tf-amount" placeholder="Amount ($)" required style="padding: 0.5rem;">
          <input type="password" id="tf-pin" maxlength="4" placeholder="4-Digit Payment PIN" required style="padding: 0.5rem;">
          <button type="submit" style="background: var(--primary-color); color:#fff; border:none; padding: 0.75rem; border-radius:4px; cursor:pointer;">Execute Transfer</button>
        </form>
      </section>

      <!-- User Transaction Ledger -->
      <section style="margin-top: 2rem;">
        <h3>Transaction Activity</h3>
        <div class="table-responsive" style="margin-top: 1rem;">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Reference ID</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="user-tx-history">
              <!-- Dynamically populated -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = ODIN.getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('welcome-msg').innerText = `Welcome, ${user.name}`;

      const refreshDashboard = () => {
        const balance = ODIN.calculateBalance(user.accountNumber);
        document.getElementById('user-balance').innerText = `$${balance.toFixed(2)}`;

        const txs = ODIN.getStorage(ODIN.KEYS.TRANSACTIONS);
        const userTxs = txs.filter(t => t.fromAccount === user.accountNumber || t.toAccount === user.accountNumber);
        
        const tbody = document.getElementById('user-tx-history');
        tbody.innerHTML = '';
        
        userTxs.forEach(tx => {
          const isDebit = tx.fromAccount === user.accountNumber;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${new Date(tx.timestamp).toLocaleString()}</td>
            <td>${tx.id}</td>
            <td>${isDebit ? 'Debit/Transfer Out' : 'Credit/Transfer In'}</td>
            <td style="color: ${isDebit ? '#dc3545' : '#28a745'}">${isDebit ? '-' : '+'}$${parseFloat(tx.amount).toFixed(2)}</td>
            <td><span class="badge badge-${tx.status.toLowerCase().replace(/\s+/g, '-')}">${tx.status}</span></td>
          `;
          tbody.appendChild(tr);
        });
      };

      document.getElementById('transfer-form').addEventListener('submit', (e) => {
        e.preventDefault();
        try {
          const acc = document.getElementById('tf-account').value;
          const amt = document.getElementById('tf-amount').value;
          const pin = document.getElementById('tf-pin').value;
          
          ODIN.initiateTransfer(acc, amt, pin);
          alert("Transfer submitted successfully.");
          e.target.reset();
          refreshDashboard();
        } catch (err) {
          alert(err.message);
        }
      });

      refreshDashboard();
    });
  </script>
</body>
</html>
