<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Transfer Funds | ODINCORE BANK</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="app-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div
        style="
          padding: 1.5rem;
          font-weight: bold;
        "
      >
        ODINCORE BANK
      </div>


      <nav
        style="
          display:flex;
          flex-direction:column;
          gap:0.5rem;
          padding:1rem;
        "
      >

        <a
          href="dashboard.html"
          style="
            color:#fff;
            text-decoration:none;
          "
        >
          Dashboard
        </a>


        <a
          href="transfer.html"
          style="
            color:#fff;
            text-decoration:none;
          "
        >
          Transfer Funds
        </a>


        <a
          href="support.html"
          style="
            color:#fff;
            text-decoration:none;
          "
        >
          Support Desk
        </a>


        <a
          href="#"
          id="logout-link"
          style="
            color:var(--danger);
            text-decoration:none;
            margin-top:2rem;
          "
        >
          Logout
        </a>

      </nav>

    </aside>


    <!-- MAIN CONTENT -->

    <main class="main-content">

      <button
        id="sidebar-toggle"
        style="
          margin-bottom:1rem;
          width:auto;
          display:none;
        "
      >
        ☰ Menu
      </button>


      <h2>Execute Transfer</h2>


      <section
        style="
          background:var(--card-bg);
          padding:1.5rem;
          border-radius:8px;
          margin-top:1rem;
          max-width:500px;
        "
      >

        <form
          id="transfer-form"
          style="
            display:grid;
            gap:1rem;
          "
        >

          <!-- RECIPIENT -->

          <div>

            <label
              for="tf-acc"
              style="
                display:block;
                margin-bottom:0.25rem;
              "
            >
              Recipient Account Number
            </label>


            <input
              type="text"
              id="tf-acc"
              placeholder="e.g. ACC12345678"
              autocomplete="off"
              required
            >

          </div>


          <!-- AMOUNT -->

          <div>

            <label
              for="tf-amt"
              style="
                display:block;
                margin-bottom:0.25rem;
              "
            >
              Amount ($)
            </label>


            <input
              type="number"
              step="0.01"
              min="0.01"
              id="tf-amt"
              placeholder="0.00"
              required
            >

          </div>


          <!-- SUBMIT -->

          <button
            type="submit"
            id="transfer-submit"
          >
            Submit Transfer Request
          </button>

        </form>


        <!-- STATUS -->

        <div
          id="transfer-status"
          style="
            display:none;
            margin-top:1rem;
            padding:0.75rem;
            border-radius:6px;
          "
        ></div>

      </section>

    </main>

  </div>


  <!-- FIREBASE APP -->

  <script
    type="module"
    src="app.js"
  ></script>


  <!-- TRANSFER PAGE LOGIC -->

  <script type="module">

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        const form =
          document.getElementById(
            "transfer-form"
          );


        const button =
          document.getElementById(
            "transfer-submit"
          );


        const status =
          document.getElementById(
            "transfer-status"
          );


        const logout =
          document.getElementById(
            "logout-link"
          );


        /* =========================================
           LOGOUT
           ========================================= */

        if (logout) {

          logout.addEventListener(
            "click",
            async (event) => {

              event.preventDefault();

              try {

                await window.App.logout();

              } catch (error) {

                console.error(error);

                alert(
                  error.message ||
                  "Unable to log out."
                );
              }
            }
          );
        }


        /* =========================================
           TRANSFER
           ========================================= */

        form.addEventListener(
          "submit",
          async (event) => {

            event.preventDefault();


            if (
              !window.App ||
              !window.App.getCurrentUser()
            ) {

              window.location.href =
                "login.html";

              return;
            }


            const account =
              document
                .getElementById("tf-acc")
                .value
                .trim();


            const amount =
              document
                .getElementById("tf-amt")
                .value;


            if (!account) {

              alert(
                "Please enter the recipient account number."
              );

              return;
            }


            if (
              !amount ||
              Number(amount) <= 0
            ) {

              alert(
                "Please enter a valid transfer amount."
              );

              return;
            }


            try {

              button.disabled = true;

              button.textContent =
                "Submitting...";


              status.style.display =
                "block";


              status.textContent =
                "Submitting transfer request...";


              const transaction =
                await window.App.initiateTransfer({

                  toAccount:
                    account,

                  amount:
                    amount
                });


              status.textContent =
                "Transfer request submitted. Reference: " +
                transaction.reference +
                ". Status: " +
                transaction.status;


              form.reset();


              alert(
                "Transfer request submitted successfully.\n\n" +
                "Reference: " +
                transaction.reference +
                "\nStatus: " +
                transaction.status
              );


              setTimeout(
                () => {

                  window.location.href =
                    "dashboard.html";

                },
                1000
              );


            } catch (error) {

              console.error(
                "Transfer error:",
                error
              );


              status.style.display =
                "block";


              status.textContent =
                error.message ||
                "Unable to submit transfer.";


              alert(
                error.message ||
                "Unable to submit transfer."
              );


              button.disabled =
                false;


              button.textContent =
                "Submit Transfer Request";
            }

          }
        );

      }
    );

  </script>

</body>

</html>
