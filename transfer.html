<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Funds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div style="padding: 1.5rem; font-weight: bold;">ODINCORE BANK</div>
      <nav style="display: flex; flex-direction: column; gap: 0.5rem; padding: 1rem;">
        <a href="dashboard.html" style="color: #fff; text-decoration: none;">Dashboard</a>
        <a href="transfer.html" style="color: #fff; text-decoration: none;">Transfer Funds</a>
        <a href="support.html" style="color: #fff; text-decoration: none;">Support Desk</a>
        <a href="#" onclick="window.App.logout()" style="color: var(--danger); text-decoration: none; margin-top: 2rem;">Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <button id="sidebar-toggle" style="margin-bottom: 1rem; width: auto; display: none;">☰ Menu</button>

      <h2>Execute Transfer</h2>

      <section style="background: var(--card-bg); padding: 1.5rem; border-radius: 8px; margin-top: 1rem; max-width: 500px;">
        <form id="transfer-form" style="display: grid; gap: 1rem;">
          <div>
            <label style="display:block; margin-bottom: 0.25rem;">Recipient Account Number</label>
            <input type="text" id="tf-acc" placeholder="e.g. ACC12345678" required>
          </div>
          <div>
            <label style="display:block; margin-bottom: 0.25rem;">Amount ($)</label>
            <input type="number" step="0.01" id="tf-amt" placeholder="0.00" required>
          </div>
          <div>
            <label style="display:block; margin-bottom: 0.25rem;">4-Digit Security PIN</label>
            <input type="password" id="tf-pin" maxlength="4" placeholder="****" required>
          </div>
          <button type="submit">Submit Transfer Request</button>
        </form>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = window.App.getCurrentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('transfer-form').addEventListener('submit', (e) => {
        e.preventDefault();
        try {
          window.App.initiateTransfer({
            toAccount: document.getElementById('tf-acc').value,
            amount: document.getElementById('tf-amt').value,
            pin: document.getElementById('tf-pin').value
          });
          alert('Transfer request submitted successfully!');
          window.location.href = 'dashboard.html';
        } catch (err) {
          alert(err.message);
        }
      });
    });
  </script>
</body>
</html>
