<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Operations Control</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div style="padding: 1.5rem; font-weight: bold; color: #0d6efd;">ADMIN PANEL</div>
      <nav style="display: flex; flex-direction: column; gap: 0.5rem; padding: 1rem;">
        <a href="admin.html" style="color: #fff; text-decoration: none;">User & Ledger Controls</a>
        <a href="admin-support.html" style="color: #fff; text-decoration: none;">Support Desk</a>
      </nav>
    </aside>

    <main class="main-content">
      <button id="sidebar-toggle" style="margin-bottom: 1rem; width: auto; display: none;">☰ Menu</button>

      <h2>Admin Operations Center</h2>

      <!-- User Account Creation -->
      <section style="background: var(--card-bg); padding: 1.5rem; border-radius: 8px; margin-top: 1rem;">
        <h3>Register New Account</h3>
        <form id="admin-user-form" style="display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-top: 1rem;">
          <input type="text" id="reg-name" placeholder="Full Name" required>
          <input type="email" id="reg-email" placeholder="Email Address" required>
          <input type="password" id="reg-pass" placeholder="Account Password" required>
          <input type="text" id="reg-pin" placeholder="4-Digit PIN" maxlength="4" required>
          <input type="number" id="reg-bal" placeholder="Initial Balance ($)" required>
          <button type="submit">Create User</button>
        </form>
      </section>

      <!-- Ledger Transaction Controls -->
      <section style="margin-top: 2rem;">
        <h3>Transaction Ledger Overrides</h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Tx ID</th>
                <th>From</th>
                <th>To</th>
                <th>Amount</th>
                <th>Date & Time</th>
                <th>Status</th>
                <th>Action Status</th>
              </tr>
            </thead>
            <tbody id="admin-ledger-table">
              <!-- Dynamically Populated -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- app.js MUST load BEFORE calling inline script -->
  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const renderLedger = () => {
        const txs = window.App.getStorage(window.App.KEYS.TRANSACTIONS);
        const tbody = document.getElementById('admin-ledger-table');
        tbody.innerHTML = '';

        txs.forEach((tx, idx) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${tx.id}</td>
            <td>${tx.fromAccount}</td>
            <td>${tx.toAccount}</td>
            <td>$${parseFloat(tx.amount).toFixed(2)}</td>
            <td><input type="datetime-local" value="${new Date(tx.timestamp).toISOString().slice(0, 16)}" onchange="updateDate(${idx}, this.value)"></td>
            <td><strong>${tx.status}</strong></td>
            <td>
              <select onchange="updateStatus(${idx}, this.value)">
                ${Object.values(window.App.STATUSES).map(s => `<option value="${s}" ${tx.status === s ? 'selected' : ''}>${s}</option>`).join('')}
              </select>
            </td>
          `;
          tbody.appendChild(tr);
        });
      };

      document.getElementById('admin-user-form').addEventListener('submit', (e) => {
        e.preventDefault();
        try {
          const newUser = window.App.registerUser({
            name: document.getElementById('reg-name').value,
            email: document.getElementById('reg-email').value,
            password: document.getElementById('reg-pass').value,
            pin: document.getElementById('reg-pin').value,
            initialBalance: document.getElementById('reg-bal').value
          });
          alert(`Account successfully created!\nAccount Number: ${newUser.accountNumber}`);
          e.target.reset();
        } catch (err) {
          alert(err.message);
        }
      });

      window.updateStatus = (index, status) => {
        const txs = window.App.getStorage(window.App.KEYS.TRANSACTIONS);
        txs[index].status = status;
        window.App.setStorage(window.App.KEYS.TRANSACTIONS, txs);
        renderLedger();
      };

      window.updateDate = (index, dateVal) => {
        const txs = window.App.getStorage(window.App.KEYS.TRANSACTIONS);
        txs[index].timestamp = new Date(dateVal).toISOString();
        window.App.setStorage(window.App.KEYS.TRANSACTIONS, txs);
        renderLedger();
      };

      renderLedger();
    });
  </script>
</body>
</html>
