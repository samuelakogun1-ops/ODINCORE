<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorize Transfer | Odin Private</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="app.js"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-slate-100 p-6">
    <div class="w-full max-w-md rounded-[2.5rem] border border-slate-200 bg-white p-8 text-center shadow-2xl">
        <div class="mb-6">
            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-blue-50 text-blue-600"><i class="fas fa-shield-check text-2xl"></i></div>
            <h2 class="text-xl font-bold text-slate-800" data-i18n="page.review.title">Final Authorization</h2>
            <p class="mt-1 text-xs font-bold uppercase tracking-[0.2em] text-slate-400" data-i18n="page.review.subtitle">Secure review before dispatch</p>
        </div>

        <div class="mb-8 space-y-4 rounded-3xl border border-slate-100 bg-slate-50 p-6 text-left">
            <div class="flex justify-between border-b border-slate-200 pb-2">
                <span class="text-[10px] font-bold uppercase text-slate-400" data-i18n="page.review.beneficiary">Beneficiary</span>
                <span id="dispName" class="text-sm font-bold text-slate-800">---</span>
            </div>
            <div class="flex justify-between border-b border-slate-200 pb-2">
                <span class="text-[10px] font-bold uppercase text-slate-400" data-i18n="page.review.amount">Amount</span>
                <span id="dispAmt" class="text-sm font-bold text-blue-600">$0.00</span>
            </div>
            <div class="pt-2 text-center">
                <p class="text-[9px] font-bold uppercase text-slate-400" data-i18n="page.review.status">Transaction status</p>
                <p id="statusText" class="text-xs font-bold text-orange-500" data-i18n="page.review.pending">Awaiting secure confirmation</p>
            </div>
        </div>

        <div class="mb-4">
            <label class="mb-2 block text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400" data-i18n="page.review.pinLabel">Transaction PIN</label>
            <input id="reviewPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••" class="w-full rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm font-medium focus:border-blue-500 focus:outline-none">
        </div>
        <button id="finalBtn" class="w-full rounded-2xl bg-slate-900 py-5 font-bold text-white shadow-lg transition hover:bg-black" data-i18n="page.review.confirm">Confirm & Dispatch</button>
    </div>

    <script>
        const app = window.odinApp;
        const pendingTransfer = JSON.parse(localStorage.getItem('pendingTransfer') || '{}');
        const currentUser = app ? app.getCurrentUserProfile() : null;
        const statusText = document.getElementById('statusText');
        document.getElementById('dispName').textContent = pendingTransfer.beneficiary || 'Unknown';
        document.getElementById('dispAmt').textContent = '$' + Number(pendingTransfer.amount || 0).toLocaleString();
        document.getElementById('finalBtn').textContent = pendingTransfer.status === 'Processing' ? 'Processing transfer' : 'Confirm & Dispatch';
        statusText.textContent = app ? app.formatStatus(pendingTransfer.status || 'Processing') : 'Processing';

        document.getElementById('finalBtn').addEventListener('click', function () {
            const btn = this;
            const reviewPin = document.getElementById('reviewPin').value.trim();
            if (!currentUser || !app.verifyTransactionPin(currentUser, reviewPin)) {
                statusText.textContent = app ? app.t('page.transfer.pinError', 'The PIN you entered is incorrect.') : 'The PIN you entered is incorrect.';
                statusText.className = 'text-xs font-bold text-red-600';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Processing...';
            statusText.textContent = app ? app.t('page.review.processingMessage', 'Your transfer is being prepared for processing.') : 'Your transfer is being prepared for processing.';
            statusText.className = 'text-xs font-bold text-blue-600';

            app.completeTransferRequest(pendingTransfer, 'Completed');
            localStorage.setItem('pendingTransfer', JSON.stringify({ ...pendingTransfer, status: 'Completed', adminDecision: 'Completed' }));

            setTimeout(() => {
                window.location.href = 'success.html';
            }, 700);
        });
    </script>
</body>
</html>
